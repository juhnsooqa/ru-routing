name: Обновление списков

on:
  schedule:
    # Раз в 2 дня в 04:00 UTC. Cron в GitHub Actions использует день месяца,
    # поэтому на стыке месяцев запуск может прийтись на два дня подряд —
    # это безвредно: коммит делается только при реальных изменениях.
    - cron: "0 4 */2 * *"
  workflow_dispatch:
  # Прогон на push по исходникам: поломку проверочного шага иначе видно
  # только на следующем плановом запуске, то есть через сутки.
  # Сам workflow коммитит только dist/ и docs/, поэтому себя не перезапускает.
  push:
    branches: [main]
    paths:
      - '.github/workflows/update.yml'
      - '*.py'
      - 'ru-domains-seed.json'
      - 'templates/**'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Обновить домены из апстрима
        run: python update_ru_domains.py

      - name: Проверки
        run: python test_update_offline.py

      - name: Собрать geosite.dat и geoip.dat
        run: python build_dat.py --verify

      - name: Профили и ссылки
        run: python make_profiles.py

      - name: Проверить .dat настоящим Xray
        run: |
          set -e
          curl -fsSL -o xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -o -q xray.zip xray
          chmod +x xray
          cp dist/ru-routing-geosite.dat dist/ru-routing-geoip.dat .
          # Конфиг сгенерирован build_dat.py и ссылается на каждую собранную
          # категорию — захардкоженный список рассинхронизировался бы с .dat.
          XRAY_LOCATION_ASSET=. ./xray run -test -config dist/xray-check.json
          rm -f xray xray.zip ru-routing-geosite.dat ru-routing-geoip.dat

      - name: Закоммитить изменения
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dist docs
          if git diff --cached --quiet; then
            echo "изменений нет"
          else
            git commit -m "Обновление списков $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Выложить .dat в релиз latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest --title "Актуальные гео-файлы" \
              --notes "Обновляется автоматически раз в 2 дня. Ссылки в dist/links.md."
          fi
          gh release upload latest dist/ru-routing-geosite.dat dist/ru-routing-geoip.dat --clobber
